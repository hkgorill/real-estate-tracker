name: 부동산 시장 지표 수집

on:
  schedule:
    # KST 04:00 = UTC 19:00 (전날) — 매일 실행
    # R-ONE(주간) / ECOS(월간) / MOLIT(월간) 모두 당일 판단 후 수집
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: '수집 소스 (all / rbone / ecos / molit)'
        required: false
        default: 'all'
      deal_ym:
        description: 'MOLIT 거래년월 (YYYYMM, 비워두면 전월 자동)'
        required: false
        default: ''
      week:
        description: 'R-ONE 주차 (YYYYWW, 비워두면 현재 주차 자동)'
        required: false
        default: ''
      region:
        description: 'MOLIT 지역 필터 (비워두면 전체, 예: 강남구)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write   # Workload Identity Federation 필수

jobs:
  collect:
    name: 부동산 지표 수집 및 Sheets 적재
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Google Cloud 인증 (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Sheets 스키마 초기화 (최초 1회 — 이미 존재하면 건너뜀)
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python setup_sheets.py

      - name: 지표 수집 및 Sheets 적재
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          RBONE_API_KEY: ${{ secrets.RBONE_API_KEY }}
          LOG_LEVEL: INFO
          REQUEST_DELAY_MIN: '1.0'
          REQUEST_DELAY_MAX: '2.5'
        run: |
          ARGS="--source ${{ github.event.inputs.source || 'all' }}"
          [ -n "${{ github.event.inputs.deal_ym }}"  ] && ARGS="$ARGS --deal-ym ${{ github.event.inputs.deal_ym }}"
          [ -n "${{ github.event.inputs.week }}"     ] && ARGS="$ARGS --week ${{ github.event.inputs.week }}"
          [ -n "${{ github.event.inputs.region }}"   ] && ARGS="$ARGS --region '${{ github.event.inputs.region }}'"
          python collect.py $ARGS

      - name: 실패 요약
        if: failure()
        run: |
          echo "::error::지표 수집 실패. 로그를 확인하세요."
          echo "실행 시각 (KST): $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
